[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turret-control"
version = "0.1.0"
description = "Networked 2-axis ball-turret control server (pigeon deterrent / camera gimbal)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "gunicorn>=21.2,<24.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "websockets>=12.0",
    "httpx>=0.27",
    "onvif-python>=0.2.10,<0.3",
]

[project.optional-dependencies]
ai = ["ultralytics>=8.1", "scipy>=1.10"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012", # mutable class attrs without ClassVar - noisy with pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(build|dist|\\.venv)"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
