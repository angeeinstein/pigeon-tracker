; PlatformIO project for the turret controller (ESP-IDF, no Arduino).
;
; Board-specific values live in build flags so the same source builds for
; different hardware revisions. Nothing here has a "safe guess" for GPIO
; numbers on purpose - see include/board_config.h.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DTURRET_FIRMWARE_VERSION=\"0.1.0\"
    ; Wi-Fi and server settings. Prefer include/secrets.h (git-ignored) for
    ; credentials; these flags are here for CI builds and one-off flashes.
    ; -DTURRET_WIFI_SSID=\"my-network\"
    ; -DTURRET_WIFI_PASSWORD=\"my-password\"
    ; -DTURRET_SERVER_URI=\"ws://192.168.1.10:8080/ws/hardware\"
    ; -DTURRET_CONTROLLER_TOKEN=\"...\"
    ; -DTURRET_CONTROLLER_ID=\"turret-1\"

[env:esp32dev]
board = esp32dev
; See partitions.csv: 3 MB for the application instead of the default 1 MB,
; which this firmware already fills to 89 %.
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    ; Pins in board_config.h have been assigned for a standard ESP32 DevKit.
    ; Comment this out again if you rewire and want the build to stop until
    ; you have re-checked them.
    -DTURRET_PINS_CONFIGURED=1

[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions.csv
build_flags =
    ${env.build_flags}
    ; Deliberately still guarded: the pin choices in board_config.h are for a
    ; classic ESP32. On the S3, GPIO 26-32 are wired to the SPI flash/PSRAM on
    ; most modules, so reusing them would be a boot failure at best. Assign S3
    ; pins first, then enable this.
    ; -DTURRET_PINS_CONFIGURED=1

; Note: only Wi-Fi station mode is implemented today. An Ethernet board needs
; the netif setup in src/wifi_manager.c replaced; nothing above that layer
; changes. See firmware/README.md.
